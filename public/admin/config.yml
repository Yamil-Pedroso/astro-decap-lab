local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images/uploads"
public_folder: "../../assets/images/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "src/content/products"
    create: true
    extension: "md"
    format: "frontmatter"

    slug: "{{slug}}"

    fields:
      - label: "Name"
        name: "name"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "string"

      - label: "Price"
        name: "price"
        widget: "number"
        value_type: "float"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Image"
        name: "image"
        widget: "image"

  - name: "categories"
    label: "Categories"
    folder: "src/content/categories"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"

    fields:
      - label: "Name"
        name: "name"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Image"
        name: "image"
        widget: "string"

      - label: "Order"
        name: "order"
        widget: "number"
        value_type: "int"
