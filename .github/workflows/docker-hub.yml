name: Docker Hub Multi-Arch

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: yamivirtuality/reboot-lab:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker Hub image to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull yamivirtuality/reboot-lab:latest

            docker stop reboot-lab-web || true
            docker rm reboot-lab-web || true

            docker run -d \
              --name reboot-lab-web \
              --restart unless-stopped \
              --env-file /var/www/astro-decap-lab/.env \
              -p 127.0.0.1:8082:4321 \
              yamivirtuality/reboot-lab:latest

            sleep 5

            curl --fail http://127.0.0.1:8082 || exit 1

            docker ps
