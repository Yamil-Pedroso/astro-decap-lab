name: Production Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect VPS path
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            whoami
            pwd
            ls -la /var/www
            ls -la /var/www/astro-decap-lab
            cd /var/www/astro-decap-lab
            pwd
            git status
