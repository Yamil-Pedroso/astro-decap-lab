name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Update production code
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/astro-decap-lab
            git status
            git pull origin main

            docker build -t reboot-lab .

            docker stop reboot-lab-web
            docker rm reboot-lab-web

            docker run -d \
              --name reboot-lab-web \
              --restart unless-stopped \
              -p 127.0.0.1:8082:80 \
              reboot-lab

            sleep 3

            curl --fail http://127.0.0.1:8082 || exit 1

            docker ps
